<div class="contenedorServices">
  <div class="leftService">
    <div>
      <div class="kpi-title">
        <span>LISTADO POR TRABAJADOR</span>
      </div>
      <!-- <h4>Listado por trabajador</h4> -->
      <table mat-table [dataSource]="monthlysales" class="mat-elevation-z8">
        <!-- Item Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let transaction">
            {{ transaction.fecha }}
          </td>
          <td mat-footer-cell *matFooterCellDef>Total</td>
        </ng-container>

        <!-- Cost Column -->
        <ng-container matColumnDef="cantidad">
          <th mat-header-cell *matHeaderCellDef>Cantidad</th>
          <td mat-cell *matCellDef="let transaction">
            {{ transaction.registros }}
          </td>
          <td mat-footer-cell *matFooterCellDef>{{ getTotalRegistre() }}</td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Precio</th>
          <td mat-cell *matCellDef="let transaction">
            ${{ transaction.total }}
          </td>
          <td mat-footer-cell *matFooterCellDef>
            {{ getTotal() | currency: "MXN" }}
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
      </table>
    </div>
  </div>
