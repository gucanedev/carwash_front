<div class="containerform">
  <header class="headerC">Detalle Venta</header>
  <mat-chip-option color="accent" selected disabled
    >{{ this.nombreCliente }}
  </mat-chip-option>
  <mat-chip-option color="accent" selected disabled
    >{{ this.nombreBien }}
  </mat-chip-option>

  <div style="margin-top: 10px; display: grid; grid-auto-flow: row">
    <h4 id="example-radio-group-label">¿Quien Atendio el servicio?</h4>
    <mat-radio-group
      aria-labelledby="example-radio-group-label"
      class="example-radio-group"
      [(ngModel)]="employeeId"
    >
      @for (employee of employees; track employee.id) {
      <mat-radio-button class="example-radio-button" [value]="employee.id">{{
        employee.descripcion
      }}</mat-radio-button>
      }
    </mat-radio-group>
  </div>
  <div style="margin-top: 10px">
    <table mat-table [dataSource]="itemSale" class="mat-elevation-z8">
      <!-- Item Column -->
      <ng-container matColumnDef="cliente">
        <th mat-header-cell *matHeaderCellDef>Servicios</th>
        <td mat-cell *matCellDef="let transaction">{{ transaction.nombre }}</td>
        <td mat-footer-cell *matFooterCellDef>Total</td>
      </ng-container>

      <!-- Cost Column -->
      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let transaction">
          ${{ transaction.precio }}
        </td>
        <td mat-footer-cell *matFooterCellDef>${{ getTotal() }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
    </table>
  </div>

  <div align="end" style="margin-right: 10px">
    <button
      mat-raised-button
      color="secundary"
      (click)="regresar()"
      style="margin: 10px"
    >
      Regresar
    </button>
    @if(this.estatudId==2){
    <button mat-raised-button color="primary" (click)="paySale()">Pagar</button>
    }
  </div>
</div>
